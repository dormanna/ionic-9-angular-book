<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title i18n="@@menu.home">Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <img
    class="hero"
    [src]="heroUrl"
    alt="The Rhine at Bonn under a summer sky"
    i18n-alt="@@home.heroAlt">

  <div class="ion-padding">
    <app-logo></app-logo>

    <h1>Best of Bonn Tours</h1>

    <p i18n="@@home.intro">
      Discover Bonn, the Rhine and the Seven Mountains
      with experienced local guides.
    </p>

    <h2 id="region" i18n="@@home.region">
      Which region would you like to explore?
    </h2>

    <ion-radio-group
      aria-labelledby="region"
      [value]="region()"
      (ionChange)="region.set($event.detail.value)">
      @for (region of regions(); track region.id) {
        <ion-radio
          class="ion-padding-vertical"
          [value]="region.id"
          labelPlacement="end"
          justify="start">
          {{ region.name }}
        </ion-radio>
      }
    </ion-radio-group>

    <ion-button
      class="ion-margin-top"
      expand="block"
      (click)="showRegion()"
      i18n="@@home.show">
      Show tours
    </ion-button>

    <ion-button
      class="ion-margin-top"
      expand="block"
      fill="outline"
      routerLink="/tours"
      i18n="@@home.browse">
      Browse all tours
    </ion-button>
  </div>
</ion-content>
