<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        [defaultHref]="'/tours/' + id()"></ion-back-button>
    </ion-buttons>
    <ion-title>Request</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-breadcrumbs>
    <ion-breadcrumb routerLink="/tours">Tours</ion-breadcrumb>
    <ion-breadcrumb [routerLink]="['/tours', id()]">
      {{ tour()?.title }}
    </ion-breadcrumb>
    <ion-breadcrumb aria-current="page">
      Request
    </ion-breadcrumb>
  </ion-breadcrumbs>

  @if (tour(); as tour) {
    <ion-accordion-group>
      <ion-accordion value="about">
        <ion-item slot="header">
          <ion-label>About this tour</ion-label>
        </ion-item>
        <div slot="content" class="ion-padding">
          {{ tour.summary }}
        </div>
      </ion-accordion>

      <ion-accordion value="facts">
        <ion-item slot="header">
          <ion-label>Key facts</ion-label>
        </ion-item>
        <div slot="content" class="ion-padding">
          {{ tour.duration }} min,
          {{ tour.price }} EUR / group
        </div>
      </ion-accordion>
    </ion-accordion-group>
  }

  <h2>When would you like to go?</h2>

  <ion-datetime
    presentation="date-time"
    hourValues="9,10,11,12,13,14,15,16,17"
    minuteValues="0,30"
    [min]="earliest"
    [max]="latest"
    [value]="request().date"
    (ionChange)="setDate($event.detail.value)">
  </ion-datetime>

  <h2>How many people?</h2>

  <ion-picker>
    <ion-picker-column
      aria-label="Number of people"
      [value]="request().people"
      (ionChange)="setPeople($event.detail.value)">
      @for (size of groupSizes(); track size) {
        <ion-picker-column-option [value]="size">
          {{ size }}
        </ion-picker-column-option>
      }
    </ion-picker-column>
  </ion-picker>

  <h2>Who is asking?</h2>

  <ion-input
    class="ion-margin-bottom"
    fill="outline"
    label="First name"
    label-placement="stacked"
    autocomplete="given-name"
    [value]="request().firstName"
    (ionInput)="patch({ firstName: $event.detail.value ?? '' })">
  </ion-input>

  <ion-input
    class="ion-margin-bottom"
    fill="outline"
    label="Last name"
    label-placement="stacked"
    autocomplete="family-name"
    [value]="request().lastName"
    (ionInput)="patch({ lastName: $event.detail.value ?? '' })">
  </ion-input>

  <ion-input
    class="ion-margin-bottom"
    fill="outline"
    type="email"
    label="Email"
    label-placement="stacked"
    autocomplete="email"
    [value]="request().email"
    (ionInput)="patch({ email: $event.detail.value ?? '' })">
  </ion-input>

  <ion-textarea
    class="ion-margin-bottom"
    fill="outline"
    label="Anything we should know?"
    label-placement="stacked"
    helper-text="We answer within one working day."
    auto-grow="true"
    [value]="request().message"
    (ionInput)="patch({ message: $event.detail.value ?? '' })">
  </ion-textarea>
</ion-content>
