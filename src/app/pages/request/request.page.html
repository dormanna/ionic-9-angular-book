<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        [defaultHref]="'/tours/' + id()"></ion-back-button>
    </ion-buttons>
    <ion-title>Request</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-breadcrumbs>
    <ion-breadcrumb routerLink="/tours">Tours</ion-breadcrumb>
    <ion-breadcrumb [routerLink]="['/tours', id()]">
      {{ tour()?.title }}
    </ion-breadcrumb>
    <ion-breadcrumb aria-current="page">
      Request
    </ion-breadcrumb>
  </ion-breadcrumbs>

  @if (tour(); as tour) {
    <ion-accordion-group>
      <ion-accordion value="about">
        <ion-item slot="header">
          <ion-label>About this tour</ion-label>
        </ion-item>
        <div slot="content" class="ion-padding">
          {{ tour.summary }}
        </div>
      </ion-accordion>

      <ion-accordion value="facts">
        <ion-item slot="header">
          <ion-label>Key facts</ion-label>
        </ion-item>
        <div slot="content" class="ion-padding">
          {{ tour.duration }} min,
          {{ tour.price }} EUR / group
        </div>
      </ion-accordion>
    </ion-accordion-group>
  }

  <p>A form arrives in chapter 7.</p>
</ion-content>
