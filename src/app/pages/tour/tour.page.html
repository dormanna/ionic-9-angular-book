<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tours"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ tour()?.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="toggleFavorite()"
        [attr.aria-label]="isFavorite()
          ? 'Remove from favorites'
          : 'Add to favorites'">
        <ion-icon
          slot="icon-only"
          aria-hidden="true"
          [name]="isFavorite() ? 'heart' : 'heart-outline'">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (tour(); as tour) {
    <ion-card>
      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="12" size-md="6">
            <img [src]="tour.imageUrl" alt="">
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-card-header>
              <ion-card-title>{{ tour.title }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p>{{ tour.summary }}</p>
              <ion-chip>
                <ion-icon
                  name="time-outline"
                  aria-hidden="true">
                </ion-icon>
                <span>{{ tour.duration }} min</span>
              </ion-chip>
              <ion-chip>
                <ion-icon
                  name="people-outline"
                  aria-hidden="true">
                </ion-icon>
                <span>up to {{ tour.maxPersons }} people</span>
              </ion-chip>
              <ion-chip>
                <ion-icon
                  name="cash-outline"
                  aria-hidden="true">
                </ion-icon>
                <span>{{ tour.price }} EUR / group</span>
              </ion-chip>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>

    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button
        [routerLink]="['/tours', id(), 'request']"
        aria-label="Request this tour">
        <ion-icon name="paper-plane-outline" aria-hidden="true">
        </ion-icon>
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
