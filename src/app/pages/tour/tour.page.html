<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tours"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ tour()?.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="toggleFavorite()"
        [attr.aria-label]="isFavorite()
          ? 'Remove from favorites'
          : 'Add to favorites'">
        <ion-icon
          slot="icon-only"
          aria-hidden="true"
          [name]="isFavorite() ? 'heart' : 'heart-outline'">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (tour(); as tour) {
    <ion-card>
      <img
        [src]="tour.imageUrl"
        [alt]="tour.title"
        decoding="async">
      <ion-card-header>
        <ion-card-subtitle>
          {{ tour.duration }} min
        </ion-card-subtitle>
        <ion-card-title>{{ tour.title }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ tour.summary }}</p>
        <p>{{ tour.price }} EUR / group</p>
      </ion-card-content>
    </ion-card>

    <div class="ion-padding">
      <ion-button
        expand="block"
        [routerLink]="['/tours', id(), 'request']">
        Request this tour
      </ion-button>
    </div>
  }
</ion-content>
