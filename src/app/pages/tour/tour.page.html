<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tours"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ tour()?.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>{{ tour()?.summary }}</p>
  <p>{{ tour()?.price }} EUR / group</p>
  <ion-button [routerLink]="['/tours', id(), 'request']">
    Request this tour
  </ion-button>

  <ion-button fill="outline" (click)="openActions()">
    Options
  </ion-button>
  <p>You chose: {{ chosen() }}</p>
</ion-content>
