<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tours"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ tour()?.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="toggleFavorite()"
        [attr.aria-label]="isFavorite()
          ? 'Remove from favourites'
          : 'Add to favourites'">
        <ion-icon
          slot="icon-only"
          aria-hidden="true"
          [name]="isFavorite() ? 'heart' : 'heart-outline'">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>{{ tour()?.summary }}</p>
  <p>{{ tour()?.price }} EUR / group</p>
  <ion-button [routerLink]="['/tours', id(), 'request']">
    Request this tour
  </ion-button>
</ion-content>
