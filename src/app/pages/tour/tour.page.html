<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/tours"
        text="Back"
        i18n-text="@@back"></ion-back-button>
    </ion-buttons>
    <ion-title role="heading" aria-level="1">
      {{ tour()?.title }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="toggleFavorite()"
        [attr.aria-label]="favoriteLabel()">
        <ion-icon
          #heart
          slot="icon-only"
          aria-hidden="true"
          [name]="isFavorite() ? 'heart' : 'heart-outline'">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (tour(); as tour) {
    <ion-card>
      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="12" size-md="6">
            <img [src]="tour.imageUrl" alt="">
          </ion-col>
          <ion-col size="12" size-md="6">
            <ion-card-header>
              <ion-card-title>{{ tour.title }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p>{{ tour.summary }}</p>
              <ion-chip>
                <ion-icon
                  name="time-outline"
                  aria-hidden="true">
                </ion-icon>
                <span>{{ tour.duration }} min</span>
              </ion-chip>
              <ion-chip>
                <ion-icon
                  name="people-outline"
                  aria-hidden="true">
                </ion-icon>
                <span i18n="@@tour.upTo">
                  up to {{ tour.maxPersons }} people
                </span>
              </ion-chip>
              <ion-chip>
                <ion-icon
                  name="cash-outline"
                  aria-hidden="true">
                </ion-icon>
                <span i18n="@@tour.from">
                  from {{ tour.price }} EUR per group
                </span>
              </ion-chip>
              <ion-chip>
                <ion-icon
                  name="location-outline"
                  aria-hidden="true">
                </ion-icon>
                <span>{{ tour.startingPoint.location }}</span>
              </ion-chip>
              <ion-button
                fill="outline"
                (click)="openDirections()">
                <ion-icon
                  slot="start"
                  name="navigate-outline"
                  aria-hidden="true">
                </ion-icon>
                <ng-container i18n="@@tour.directions">
                  Directions
                </ng-container>
              </ion-button>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>

    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button aria-label="Tour actions"
                      i18n-aria-label="@@tour.actions">
        <ion-icon name="ellipsis-horizontal" aria-hidden="true">
        </ion-icon>
      </ion-fab-button>
      <ion-fab-list side="top">
        <ion-fab-button
          [routerLink]="['/tours', id(), 'request']"
          aria-label="Request this tour"
          i18n-aria-label="@@tour.request">
          <ion-icon
            name="paper-plane-outline"
            aria-hidden="true">
          </ion-icon>
        </ion-fab-button>
        @if (canShare()) {
          <ion-fab-button
            (click)="share()"
            aria-label="Share this tour"
            i18n-aria-label="@@tour.share">
            <ion-icon
              name="share-social-outline"
              aria-hidden="true">
            </ion-icon>
          </ion-fab-button>
        }
      </ion-fab-list>
    </ion-fab>
  }
</ion-content>
