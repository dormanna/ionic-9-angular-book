<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tours"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ tour()?.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="toggleFavorite()"
        [attr.aria-label]="isFavorite()
          ? 'Remove from favorites'
          : 'Add to favorites'">
        <ion-icon
          slot="icon-only"
          aria-hidden="true"
          [name]="isFavorite() ? 'heart' : 'heart-outline'">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (tour(); as tour) {
    <ion-card>
      <img [src]="tour.imageUrl" alt="">
      <ion-card-header>
        <ion-card-title>{{ tour.title }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ tour.summary }}</p>
        <ion-chip>
          <ion-icon name="time-outline" aria-hidden="true">
          </ion-icon>
          <span>{{ tour.duration }} min</span>
        </ion-chip>
        <ion-chip>
          <ion-icon name="people-outline" aria-hidden="true">
          </ion-icon>
          <span>up to {{ tour.maxPersons }} people</span>
        </ion-chip>
        <ion-chip>
          <ion-icon name="cash-outline" aria-hidden="true">
          </ion-icon>
          <span>{{ tour.price }} EUR / group</span>
        </ion-chip>
      </ion-card-content>
    </ion-card>

    <div class="ion-padding">
      <ion-button
        expand="block"
        [routerLink]="['/tours', id(), 'request']">
        Request this tour
      </ion-button>
    </div>
  }
</ion-content>
