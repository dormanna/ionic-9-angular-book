<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      Tours
      <ion-badge role="img"
                 [attr.aria-label]="tours().length + ' tours'">
        {{ tours().length }}
      </ion-badge>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (isLoading()) {
    <div class="ion-padding ion-text-center">
      <ion-spinner
        name="crescent"
        color="primary"
        aria-hidden="true">
      </ion-spinner>
      <p role="status">Loading tours</p>
    </div>
  } @else if (error()) {
    <ion-text color="danger">
      <p class="ion-padding" role="status">
        The tours could not be loaded.
      </p>
    </ion-text>
  } @else {
    <ion-list>
      @for (tour of tours(); track tour.id) {
        <ion-item detail="true" [routerLink]="['/tours', tour.id]">
          <ion-thumbnail slot="start">
            <img
              [src]="tour.thumbnailUrl"
              alt=""
              loading="lazy"
              decoding="async">
          </ion-thumbnail>
          <ion-label>
            <h2>{{ tour.title }}</h2>
            <p>{{ tour.price }} EUR / group</p>
          </ion-label>
          <ion-note slot="end">{{ tour.duration }} min</ion-note>
        </ion-item>
      } @empty {
        <ion-item>
          <ion-label>No tours to show.</ion-label>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
