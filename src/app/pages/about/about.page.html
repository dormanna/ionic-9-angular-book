<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>About</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>About page.</p>

  <ion-checkbox
    class="ion-margin-bottom"
    justify="space-between"
    [checked]="notify()"
    (ionChange)="notify.set($event.detail.checked)">
    Email me about new tours
  </ion-checkbox>

  <p>The signal says {{ notify() }}.</p>

  <ion-checkbox
    class="ion-margin-bottom"
    justify="space-between"
    [checked]="true">
    Checked
  </ion-checkbox>

  <ion-checkbox
    class="ion-margin-bottom"
    justify="space-between"
    [indeterminate]="true">
    Mixed
  </ion-checkbox>

  <ion-checkbox
    class="ion-margin-bottom"
    justify="space-between"
    [checked]="true"
    [disabled]="true">
    Disabled
  </ion-checkbox>
</ion-content>
