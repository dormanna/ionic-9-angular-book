<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="menu-list">
          <app-logo role="img" aria-label="BoB Tours"></app-logo>
          <ion-note>Best of Bonn</ion-note>

          @for (page of pages; track page.url) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                routerDirection="root"
                [routerLink]="[page.url]"
                routerLinkActive="selected"
                lines="none"
                detail="false">
                <ion-icon
                  aria-hidden="true"
                  slot="start"
                  [ios]="page.icon + '-outline'"
                  [md]="page.icon + '-sharp'"></ion-icon>
                <ion-label>{{ page.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
      <ion-footer class="ion-padding">
        <ion-note id="appearance">Appearance</ion-note>
        <ion-radio-group
          aria-labelledby="appearance"
          [value]="theme.choice()"
          (ionChange)="theme.choice.set($event.detail.value)">
          @for (option of appearances; track option.value) {
            <ion-radio
              class="ion-padding-vertical"
              [value]="option.value"
              labelPlacement="end"
              justify="start">
              {{ option.title }}
            </ion-radio>
          }
        </ion-radio-group>
      </ion-footer>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
